<script id="edScript">(function(){
  /* =====================================================================
     EDITOR DE TEXTO — copia editable de una lámina
     ---------------------------------------------------------------------
     Edita, en el lugar, todo el texto de la columna izquierda (tag, h2,
     lead, nombre y texto del caso) más la fuente del pie. Guarda en
     el bloque <script id="edData"> DEL PROPIO ARCHIVO HTML (persistente, viaja
     con el archivo). Es sincrónico al cargar, así el texto guardado ya está
     disponible cuando el guion de la lámina corre showCase(0).
     Guardar (botón o Ctrl+S, en cualquier momento) reescribe ese bloque en el
     .html vía File System Access API (Chrome/Edge); en otros navegadores
     descarga UN .html actualizado. Nunca genera carpetas. Las fotos de cada
     caso (D.photos) se guardan en el mismo bloque; el .glb no.

     Segunda fila de la barra: tamaño y tipografía DE LA SECCIÓN activa.
     Cada sección se ajusta por separado y se guarda con la lámina, en el
     mismo objeto: D.st[selector] = { s:<tamaño en --u>, f:'sans'|'mono' }.
     ===================================================================== */
  var KEY='esete:text:slides-01';
  var HKEY=KEY+'|'+(function(){ try{ return decodeURIComponent(location.pathname.split('/').pop()||''); }catch(e){ return ''; } })();   // el vínculo es por archivo, no solo por lámina
  /* El mismo objeto que lee showCase: si no había nada guardado se crea
     vacío y se deja colgado de window, o las ediciones no llegarían a la
     lámina al cambiar de caso dentro de la misma sesión. */
  var D=window.__EDTEXT__||(window.__EDTEXT__={});
  var SEL=['.tag','h2','.lead','#caseName','#caseText','.src','.pres-name'];
  var BASE={}, lastEd=null;
  var editing=false, dirty=false, saveT=0;
  function $(s){ return document.querySelector(s); }
  function setText(el,v){ if(el&&v!=null&&String(v)!==el.textContent) el.textContent=v; }

  /* El lead conserva <b>/<i> del diseño; cualquier otra etiqueta se desarma
     y se queda su texto. Pegar HTML no puede meter estilos ni scripts. */
  function clean(html){
    var d=document.createElement('div'); d.innerHTML=String(html);
    (function walk(n){
      for(var i=n.childNodes.length-1;i>=0;i--){
        var c=n.childNodes[i];
        if(c.nodeType===1){
          var t=c.tagName.toLowerCase();
          if(t!=='b'&&t!=='i'){ walk(c); while(c.firstChild) n.insertBefore(c.firstChild,c); n.removeChild(c); }
        } else if(c.nodeType!==3){ n.removeChild(c); }
      }
    })(d);
    return d.innerHTML;
  }

  /* ---------------------------------------------------------------------
     Tamaño y tipografía
     --u es el factor de escala de la familia (min(w/1024, h/576)), así que
     el tamaño se guarda en «px de --u» y nunca se rompe al cambiar de
     ventana. La base de cada sección se mide una vez, antes de aplicar
     nada: es el valor original de la hoja, sin estilos en línea.
     --------------------------------------------------------------------- */
  function uUnit(){
    var u=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--u'));
    return (u&&!isNaN(u))?u:1;
  }
  function measure(){
    var u=uUnit();
    SEL.forEach(function(s){
      var e=$(s); if(!e) return;
      BASE[s]=Math.round((parseFloat(getComputedStyle(e).fontSize)/u)*10)/10;
    });
  }
  function selOf(el){
    if(!el) return null;
    for(var i=0;i<SEL.length;i++){ if($(SEL[i])===el) return SEL[i]; }
    return null;
  }
  function stOf(s){ D.st=D.st||{}; return (D.st[s]=D.st[s]||{}); }
  function styleFor(s,o){
    var e=$(s); if(!e) return;
    if(o&&o.s!=null) e.style.fontSize='calc(var(--u)*'+o.s+'px)'; else e.style.fontSize='';
    if(o&&o.f) e.style.fontFamily=(o.f==='mono')?'var(--mono)':'var(--sans)'; else e.style.fontFamily='';
  }
  function applyStyles(){
    if(!D.st) return;
    for(var s in D.st){ if(D.st.hasOwnProperty(s)) styleFor(s,D.st[s]); }
  }
  function sizeOf(s){
    var o=D.st&&D.st[s]; if(o&&o.s!=null) return o.s;
    return BASE[s]!=null?BASE[s]:null;
  }
  function fontOf(s){
    var o=D.st&&D.st[s]; if(o&&o.f) return o.f;
    var e=$(s); if(!e) return 'sans';
    return getComputedStyle(e).fontFamily.indexOf('DM Mono')>=0?'mono':'sans';
  }
  function syncFmt(){
    var s=selOf(lastEd), sz=$('#edSz'), fs=$('#edFont');
    if(sz) sz.textContent=(s&&sizeOf(s)!=null)?String(Math.round(sizeOf(s)*10)/10):'—';
    if(fs) fs.value=s?fontOf(s):'sans';
  }

  /* ---- Presentador: círculo con foto + nombre, junto a la etiqueta ----
     En la presentación solo aparece si hay foto o nombre; en edición siempre.
     La foto se recorta «cover» a un cuadrado de 192 px y viaja en el .html. */
  function presSync(){
    var p=$('#pres'); if(!p) return;
    var has=!!(D.pphoto||(D.pname&&String(D.pname).trim()));
    p.hidden=!(editing||has);
    var im=$('#presImg'), pl=$('#presPlus'), x=$('#presX');
    if(im){
      if(D.pphoto){ if(im.getAttribute('src')!==D.pphoto) im.src=D.pphoto; im.hidden=false; }
      else { im.removeAttribute('src'); im.hidden=true; }
    }
    if(pl) pl.hidden=!!D.pphoto;
    if(x) x.hidden=!(editing&&D.pphoto);
  }
  function presCrop(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), im=new Image();
      im.onload=function(){
        var S=192, c=document.createElement('canvas'); c.width=c.height=S;
        var m=Math.min(im.width,im.height), sx=(im.width-m)/2, sy=(im.height-m)*(im.height>im.width?0.2:0.5);
        c.getContext('2d').drawImage(im,sx,sy,m,m,0,0,S,S);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',.88));
      };
      im.onerror=function(){ URL.revokeObjectURL(url); rej(new Error('imagen ilegible')); };
      im.src=url;
    });
  }

  function apply(){
    setText($('.pres-name'),D.pname); presSync();
    setText($('.tag'),D.tag); setText($('h2'),D.h2); setText($('.src'),D.src);
    var l=$('.lead');
    if(l&&D.lead!=null&&clean(D.lead)!==l.innerHTML) l.innerHTML=clean(D.lead);
  }

  /* Índice del caso visible: el contador es la única fuente que el soporte
     ya mantiene al día en todas las láminas. */
  function curIdx(){
    var c=$('#count'); if(!c) return 0;
    var m=/(\d+)\s*\/\s*\d+/.exec(c.textContent||''); return m?Math.max(0,parseInt(m[1],10)-1):0;
  }

  function touch(el){
    var i=curIdx();
    if(el.classList.contains('pres-name')){ D.pname=el.textContent; }
    else if(el.id==='caseName'||el.id==='caseText'){
      D.cases=D.cases||[]; D.cases[i]=D.cases[i]||{};
      if(el.id==='caseName') D.cases[i].n=el.textContent; else D.cases[i].t=el.textContent;
    } else if(el.classList.contains('tag')) D.tag=el.textContent;
    else if(el.tagName==='H2') D.h2=el.textContent;
    else if(el.classList.contains('lead')) D.lead=el.innerHTML;
    else if(el.classList.contains('src')) D.src=el.textContent;
    dirty=true; paint(); backup();
    clearTimeout(saveT); saveT=setTimeout(save,1200);
  }

  /* Aviso de desborde: una línea de más rompe el encuadre de la familia.
     getClientRects() sobre un bloque devuelve una sola caja, así que las
     líneas se cuentan dividiendo el alto por el interlineado. */
  function lines(el){
    var cs=getComputedStyle(el), lh=parseFloat(cs.lineHeight);
    if(!lh||isNaN(lh)) lh=parseFloat(cs.fontSize)*1.2;
    return Math.max(1,Math.round(el.getBoundingClientRect().height/lh));
  }
  function warn(el){
    el.classList.remove('ed-warn');
    var bad=false;
    if(el.tagName==='H2'||el.id==='caseName') bad=lines(el)>1;
    var c=el.closest?el.closest('.case'):null;
    if(c) bad=bad||c.scrollHeight>c.clientHeight+1;
    /* Con más tamaño o una tipografía más ancha la columna puede crecer
       hasta el pie: si lo pisa, también es desborde. */
    var src=$('.src');
    if(src) bad=bad||el.getBoundingClientRect().bottom>src.getBoundingClientRect().top-2;
    if(bad) el.classList.add('ed-warn');
  }

  function setOpen(on){
    var b=$('#edBar'), g=$('#edBurg'); if(!b) return;
    b.classList.toggle('open',on); b.classList.toggle('min',!on);
    if(g) g.setAttribute('aria-expanded',on?'true':'false');
  }

  var msgT=0;
  var toastEl=null, toastT=0;
  function toast(m){
    if(!document.body) return;
    if(!toastEl){
      toastEl=document.createElement('div'); toastEl.id='edToast'; toastEl.setAttribute('role','status');
      toastEl.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;padding:8px 16px;border-radius:999px;background:rgba(0,19,38,.94);border:1px solid rgba(155,211,233,.45);color:#e9f3f9;font:500 12px/1.2 "DM Mono",ui-monospace,monospace;letter-spacing:.04em;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent=m; toastEl.style.opacity='1';
    clearTimeout(toastT); toastT=setTimeout(function(){ toastEl.style.opacity='0'; },2600);
  }
  function flash(m){ toast(m); var e=$('#edMsg'); if(!e) return; e.textContent=m; clearTimeout(msgT); msgT=setTimeout(function(){ e.textContent=''; },2200); }
  function paint(){ var b=$('#edBar'); if(b) b.classList.toggle('dirty',dirty); }
  /* Respaldo: mientras el texto no esté guardado en el archivo, una copia vive en este navegador
     y se recupera al reabrir. Guardar con éxito la borra (done). */
  var bkT=0;
  function backup(){ clearTimeout(bkT); bkT=setTimeout(function(){ try{ localStorage.setItem(KEY,JSON.stringify(D)); }catch(e){} },400); }

  /* ---- Persistencia en el propio .html ---------------------------------- */
  var FSA=!!(window.showOpenFilePicker), FH=null, busy=false;
  var MARK_A='<scr'+'ipt id="edData" type="application/json">', MARK_B='</scr'+'ipt>';
  function build(src){
    if(src.indexOf(KEY)<0) return null;                       // no es esta lámina
    var a=src.indexOf(MARK_A); if(a<0) return null;
    var st=a+MARK_A.length, b=src.indexOf(MARK_B,st); if(b<0) return null;
    var has=false; for(var k in D){ if(D.hasOwnProperty(k)){ has=true; break; } }
    var json=JSON.stringify(has?D:null).replace(/</g,'\\u003c');
    return src.slice(0,st)+json+src.slice(b);
  }
  function idb(mode,fn){
    return new Promise(function(res){
      try{
        var r=indexedDB.open('esete-fh',1);
        r.onupgradeneeded=function(){ r.result.createObjectStore('h'); };
        r.onerror=function(){ res(null); };
        r.onsuccess=function(){
          try{ var q=fn(r.result.transaction('h',mode).objectStore('h'));
               q.onsuccess=function(){ res(q.result||null); }; q.onerror=function(){ res(null); }; }
          catch(e){ res(null); }
        };
      }catch(e){ res(null); }
    });
  }
  function fhLoad(){ return idb('readonly',function(o){ return o.get(HKEY); }); }
  function fhSave(h){ return idb('readwrite',function(o){ return o.put(h,HKEY); }); }
  function fhPerm(h,ask){
    var o={mode:'readwrite'};
    return h.queryPermission(o).then(function(r){
      if(r==='granted') return true;
      return ask?h.requestPermission(o).then(function(x){ return x==='granted'; }):false;
    });
  }
  function done(){ dirty=false; paint(); try{ localStorage.removeItem(KEY); }catch(e){} }
  function writeFH(h){
    return h.getFile().then(function(f){ return f.text(); }).then(function(src){
      var out=build(src);
      if(out==null){ FH=null; flash('ese no es el archivo de esta lámina'); return false; }
      return h.createWritable().then(function(w){ return w.write(out).then(function(){ return w.close(); }); })
        .then(function(){ done(); flash('guardado en el archivo ✓'); return true; });
    });
  }
  function download(out,name){
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
    a.download=name; document.body.appendChild(a); a.click(); a.remove();
  }
  function fallback(){                                         // Firefox / Safari: descarga UN .html actualizado (sin carpeta)
    if(/^https?:$/.test(location.protocol)){                   // servida por web: se lee su propio código, sin selector
      return fetch(location.href,{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(src){
        var out=build(src); if(out==null) throw new Error('src');
        download(out,decodeURIComponent((location.pathname.split('/').pop()||'slide.html')));
        done(); flash('descargado: reemplaza el original'); return true;
      }).catch(function(){ return pickAndDownload(); });
    }
    return pickAndDownload();
  }
  function pickAndDownload(){
    return new Promise(function(res){
      var i=document.createElement('input'); i.type='file'; i.accept='.html,.htm';
      i.onchange=function(){
        var f=i.files&&i.files[0]; if(!f){ res(false); return; }
        var r=new FileReader();
        r.onload=function(){
          var out=build(String(r.result));
          if(out==null){ flash('ese no es el archivo de esta lámina'); res(false); return; }
          download(out,f.name);
          done(); flash('descargado: reemplaza el original'); res(true);
        };
        r.readAsText(f);
      };
      i.click();
    });
  }
  /* manual=true viene de un clic/tecla (permite abrir el selector o pedir permiso);
     el autoguardado (manual=false) solo escribe si el archivo ya está vinculado. */
  function persist(manual){
    if(busy){ clearTimeout(saveT); saveT=setTimeout(function(){ persist(manual); },700); return Promise.resolve(false); }
    if(!FSA){ if(!manual){ flash('pulsa Guardar'); return Promise.resolve(false); } return fallback(); }
    busy=true;
    return Promise.resolve(FH||fhLoad()).then(function(h){
      FH=h||null;
      if(!FH){
        if(!manual){ flash('pulsa Guardar para vincular el archivo'); return false; }
        return window.showOpenFilePicker({types:[{description:'Lámina HTML',accept:{'text/html':['.html','.htm']}}]})
          .then(function(hs){ FH=hs[0]; fhSave(FH); return writeFH(FH); });
      }
      return fhPerm(FH,manual).then(function(ok){
        if(!ok){ flash('pulsa Guardar para dar permiso'); return false; }
        return writeFH(FH);
      });
    }).catch(function(e){
      try{ console.error('[guardar]',e); }catch(x){}
      busy=false;
      if(e&&e.name==='AbortError') return false;      // el usuario cerró el selector
      FH=null;                                         // vínculo roto o sin permiso: se olvida
      flash('no se pudo guardar ['+((e&&e.name)||'error')+']'+(manual?' → se descarga una copia':''));
      if(manual) fallback().catch(function(){});       // respaldo: descarga un .html actualizado
      return false;
    }).then(function(r){ busy=false; return r; });
  }
  function save(){ return persist(false); }
  window.addEventListener('beforeunload',function(e){ if(dirty){ e.preventDefault(); e.returnValue=''; } });
  function saveSoon(){ dirty=true; paint(); backup(); clearTimeout(saveT); saveT=setTimeout(save,1200); }
  window.__edTouch=function(){ saveSoon(); };   // lo llama el panel de fotos al cambiar

  function bump(d){
    var s=selOf(lastEd);
    if(!s){ flash('elegí una sección'); return; }
    var cur=sizeOf(s); if(cur==null) cur=16;
    var next=Math.round(Math.max(6,Math.min(150,cur+d))*10)/10;
    stOf(s).s=next;
    styleFor(s,D.st[s]);
    if(lastEd) warn(lastEd);
    syncFmt(); saveSoon();
  }
  function setFont(v){
    var s=selOf(lastEd);
    if(!s){ flash('elegí una sección'); return; }
    stOf(s).f=v;
    styleFor(s,D.st[s]);
    syncFmt(); saveSoon();
  }
  function resetFmt(){
    var s=selOf(lastEd);
    if(!s){ flash('elegí una sección'); return; }
    if(D.st) delete D.st[s];
    styleFor(s,null);
    if(lastEd) warn(lastEd);
    syncFmt(); saveSoon();
    flash('estilo original');
  }

  function setEditing(on){
    editing=on;
    if(on) setOpen(true);
    document.body.classList.toggle('ed-on',on);
    var b=$('#edBar'), t=$('#edToggle');
    if(b) b.classList.toggle('on',on);
    if(t){ t.setAttribute('aria-pressed',on?'true':'false'); t.textContent=on?'Listo':'Editar'; }
    SEL.forEach(function(s){
      var e=$(s); if(!e) return;
      if(on){ e.setAttribute('data-ed',''); e.setAttribute('contenteditable','true'); e.setAttribute('spellcheck','false'); }
      else { e.removeAttribute('contenteditable'); e.removeAttribute('spellcheck'); e.removeAttribute('data-ed'); warn(e); e.blur(); }
    });
    syncFmt(); presSync();
    if(!on&&dirty) persist(true);
  }

  function boot(){
    measure();
    apply();
    applyStyles();

    var bar=document.createElement('div');
    bar.id='edBar'; bar.className='min'; bar.setAttribute('role','toolbar'); bar.setAttribute('aria-label','Editor de texto');
    bar.innerHTML='<button id="edBurg" type="button" aria-expanded="false" aria-label="Abrir el editor de texto" title="Editor de texto (Ctrl+E)">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'+
      '</button>'+
      '<div class="ed-tools">'+
        '<div class="ed-row">'+
          '<span class="ed-dot" aria-hidden="true"></span>'+
          '<button id="edToggle" type="button" aria-pressed="false">Editar</button>'+
          '<button id="edSave" type="button" title="Guardar dentro de este .html (Ctrl+S)">Guardar</button>'+
          '<button id="edReset" type="button">Restablecer</button>'+
          '<span class="ed-msg" id="edMsg"></span>'+
        '</div>'+
        '<div id="edFmt">'+
          '<span class="ed-lab">Tamaño</span>'+
          '<button id="edMinus" type="button" aria-label="Achicar el texto de la sección" title="Achicar (Shift: más)">A−</button>'+
          '<span class="ed-sz" id="edSz">—</span>'+
          '<button id="edPlus" type="button" aria-label="Agrandar el texto de la sección" title="Agrandar (Shift: más)">A+</button>'+
          '<span class="ed-lab">Fuente</span>'+
          '<select id="edFont" aria-label="Tipografía de la sección" title="Tipografía de la sección">'+
            '<option value="sans">Space Grotesk</option>'+
            '<option value="mono">DM Mono</option>'+
          '</select>'+
          '<button id="edFmtReset" type="button" title="Volver al tamaño y la tipografía originales">Original</button>'+
        '</div>'+
      '</div>';
    var dock=document.createElement('div'); dock.id='edDock';
    var pr=$('#pres'); if(pr) dock.appendChild(pr);
    dock.appendChild(bar); document.body.appendChild(dock);

    /* Plegada por defecto: en la presentación solo queda el lápiz. */
    setOpen(false);
    $('#edBurg').onclick=function(){
      if(bar.classList.contains('open')){ if(editing) setEditing(false); setOpen(false); }
      else setOpen(true);
    };
    $('#edToggle').onclick=function(){ setEditing(!editing); };
    $('#edSave').onclick=function(){ persist(true); };
    $('#presPic').onclick=function(){ if(editing) $('#presIn').click(); };
    $('#presIn').onchange=function(){
      var f=this.files&&this.files[0]; this.value=''; if(!f) return;
      presCrop(f).then(function(u){ D.pphoto=u; presSync(); saveSoon(); flash('foto del presentador lista'); })
        .catch(function(){ flash('no se pudo leer la imagen'); });
    };
    $('#presX').onclick=function(){ delete D.pphoto; presSync(); saveSoon(); };
    $('#edReset').onclick=function(){
      if(!confirm('¿Volver al texto y al estilo originales de esta lámina?')) return;
      var keep={photos:D.photos,pphoto:D.pphoto,pname:D.pname};   // restablecer toca texto y estilo, no fotos ni presentador
      for(var k in D){ if(D.hasOwnProperty(k)) delete D[k]; }
      for(var kk in keep){ if(keep[kk]!=null) D[kk]=keep[kk]; }
      persist(true).then(function(ok){ if(ok) location.reload(); });
    };

    /* Los botones de tamaño no le roban el cursor a la sección: el campo
       sigue enfocado y A− / A+ actúan sobre lo que se está escribiendo. */
    ['edMinus','edPlus','edFmtReset'].forEach(function(id){
      var b=$('#'+id); if(b) b.addEventListener('mousedown',function(e){ e.preventDefault(); });
    });
    $('#edMinus').onclick=function(e){ bump(e.shiftKey?-4:-1); };
    $('#edPlus').onclick=function(e){ bump(e.shiftKey?4:1); };
    $('#edFont').onchange=function(){ setFont(this.value); };
    $('#edFmtReset').onclick=function(){ resetFmt(); };

    /* La sección activa se recuerda al tocarla o al enfocarla: los controles
       de tamaño y tipografía siempre saben a qué texto le están hablando. */
    function pick(e){
      var el=e.target;
      if(el&&el.hasAttribute&&el.hasAttribute('data-ed')){ lastEd=el; syncFmt(); }
    }
    document.addEventListener('focusin',pick,true);
    document.addEventListener('pointerdown',pick,true);
    document.addEventListener('click',pick,true);

    document.addEventListener('input',function(e){
      var el=e.target; if(!editing||!el.hasAttribute||!el.hasAttribute('data-ed')) return;
      lastEd=el; touch(el); warn(el);
    },true);

    /* Pegado siempre como texto plano y sin saltos de línea. */
    document.addEventListener('paste',function(e){
      if(!editing||!e.target.hasAttribute||!e.target.hasAttribute('data-ed')) return;
      e.preventDefault();
      var t=(e.clipboardData||window.clipboardData).getData('text/plain')||'';
      document.execCommand('insertText',false,t.replace(/\s+/g,' ').trim());
    },true);

    /* Enter no parte el renglón: la familia se midió en líneas fijas. */
    document.addEventListener('keydown',function(e){
      if(!editing||!e.target.hasAttribute||!e.target.hasAttribute('data-ed')) return;
      if(e.key==='Enter'){ e.preventDefault(); }
      if(e.key==='Escape'){ setEditing(false); setOpen(false); e.preventDefault(); }
    },true);

    /* La 'm' de «ver modelo» no puede dispararse escribiendo una letra. */
    document.addEventListener('keydown',function(e){
      if(!editing) return;
      if(e.key==='m'||e.key==='M') e.stopPropagation();
    },true);

    /* Ctrl/Cmd+S en CUALQUIER momento guarda dentro del propio .html. Sin esto el
       navegador abre «Guardar página como» y crea una carpeta con archivos. */
    document.addEventListener('keydown',function(e){
      if((e.ctrlKey||e.metaKey)&&!e.altKey&&(e.key==='s'||e.key==='S')){
        e.preventDefault(); e.stopPropagation(); persist(true);
      }
    },true);

    document.addEventListener('keydown',function(e){
      if((e.ctrlKey||e.metaKey)&&(e.key==='e'||e.key==='E')){ e.preventDefault(); setEditing(!editing); setOpen(true); }
      if(e.key==='Escape'){
        if(editing){ setEditing(false); setOpen(false); }
        else if($('#edBar').classList.contains('open')) setOpen(false);
      }
    },true);

    syncFmt();
    if(window.__EDLEGACY__){ dirty=true; paint(); flash('cambios sin guardar recuperados: pulsa Guardar'); }
    if(FSA) fhLoad().then(function(h){ FH=FH||h||null; });
  }

  /* El módulo va al final del cuerpo: el DOM de la columna ya está. No se
     espera a DOMContentLoaded ni a readyState — con los <script src> del CDN
     por delante, 'loading' puede durar segundos y la barra no aparecía. */
  if(document.body) boot(); else document.addEventListener('DOMContentLoaded',boot);
})();
</script>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(function(){
  var root=document.documentElement, body=document.body, $=function(id){ return document.getElementById(id); };
  function measure(){
    var w=body.clientWidth||1024, h=body.clientHeight||576;
    root.style.setProperty('--u',Math.min(w/1024,h/576));
  }
  measure();
  var sel=-1, idx=0;

  /* Una interacción = un caso = una foto. El resto del archivo deriva de este array:
     PHOTOS, el contador, las flechas y el badge del panel de fotos. */
  var CASES=[
    {n:"mejora compoetencias", t:"65,4 % → 87,6 % mejora en competencias pre/post RV (n=100, estudio piloto)"}
  ];
  var N=CASES.length;
  function pad(n){ return ('0'+n).slice(-2); }
  if(N<2){ $('nav').hidden=true; $('count').hidden=true; }

  var st=$('st');
  if(!window.THREE){ st.textContent='No se pudo cargar Three.js (¿sin internet?)'; return; }
  var T=THREE;
  function css(n){ return getComputedStyle(root).getPropertyValue(n).trim(); }
  function col(n){ return new T.Color(css(n)).convertSRGBToLinear(); }
  function sc(hex){ return new T.Color(hex).convertSRGBToLinear(); }

  /* =====================================================================
     BLOQUE 3D — GENERADO POR LA PLANTILLA
     ---------------------------------------------------------------------
     El render de esta lámina es una función buildScene(THREE, ctx) que
     devuelve un THREE.Group. Si el usuario pegó código propio en el
     generador se compila aquí (USER_CODE); si falla o no hay, se usa
     defaultScene (plataforma + nudo toroidal). El resto del archivo no
     cambia: cards, flechas, fotos, .glb, edición persistente.

     CONTRATO del render:
       buildScene(THREE, ctx) → THREE.Group centrado en el origen
       g.userData.update(dt,t)   opcional · animación por cuadro
       g.userData.colors()       opcional · relee --cy / --gold
       g.userData.noTurntable    opcional · true = sin giro automático
       Mallas decorativas grandes → userData.decor=true (no cuentan en el encaje)

     JERARQUÍA (el arrastre y el giro no se pelean):
       pivot  ← arrastre del usuario
         ├── spin  ← turntable + encaje (escala/centro)
         │     └── quest ← el Group del render
         └── model ← .glb cargado por el usuario
     ===================================================================== */
  var canvas=$('c'), renderer;
  try{ renderer=new T.WebGLRenderer({canvas:canvas,antialias:true,alpha:true}); }catch(e){ st.textContent='Este navegador no pudo iniciar WebGL'; return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.outputEncoding=T.sRGBEncoding;
  renderer.toneMapping=T.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.05;

  var PI=Math.PI;
  var scene=new T.Scene(), camera=new T.PerspectiveCamera(34,1,0.1,100);
  camera.position.set(0,0,9.4);

  /* ---- Entorno de estudio (PMREM): paneles emisivos alrededor del objeto ---- */
  function envPanel(S,w,h,x,y,z,c,k){
    var m=new T.Mesh(new T.PlaneGeometry(w,h), new T.MeshBasicMaterial({color:new T.Color(c).multiplyScalar(k),side:T.DoubleSide}));
    m.position.set(x,y,z); m.lookAt(0,0,0); S.add(m);
  }
  function makeEnv(bg,list){
    var S=new T.Scene(); S.background=new T.Color(bg);
    list.forEach(function(q){ envPanel(S,q[0],q[1],q[2],q[3],q[4],q[5],q[6]); });
    var pm=new T.PMREMGenerator(renderer), t=pm.fromScene(S,0.03).texture; pm.dispose(); return t;
  }
  scene.environment=makeEnv(0x0a1a2e,[
    [7,4,-4,5,4,0xffffff,6],[3,7,7,1,-2,0x9BD3E9,4],[5,2,-3,-1,-7,0xF4D171,3.5],
    [12,7,0,9,0,0xffffff,1.6],[8,3,2,-4,5,0x9BD3E9,1.2]
  ]);
  var key=new T.DirectionalLight(0xffffff,.7); key.position.set(3,5,6); scene.add(key);

  /* ---- Grupos: pivot (arrastre) → spin (turntable + encaje) → quest (el render) ---- */
  var pivot=new T.Group(); scene.add(pivot);
  var spin=new T.Group(); pivot.add(spin);
  var quest=new T.Group(); spin.add(quest);

  /* ---- Render por defecto: plataforma de exhibición + nudo toroidal ---- */
  function defaultScene(T,ctx){
    var PI=Math.PI, g=new T.Group();
    function gradTex(rgb,stops){ var c=document.createElement('canvas'), x; c.width=c.height=256; x=c.getContext('2d'); var gr=x.createRadialGradient(128,128,0,128,128,128);
      stops.forEach(function(q){ gr.addColorStop(q[0],'rgba('+rgb+','+q[1]+')'); }); x.fillStyle=gr; x.fillRect(0,0,256,256); var t=new T.CanvasTexture(c); t.encoding=T.sRGBEncoding; return t; }
    var base=new T.Group(); base.position.y=-2; g.add(base);
    base.add(new T.Mesh(new T.CylinderGeometry(3.45,3.55,.14,120),new T.MeshPhysicalMaterial({color:0x06192e,roughness:.3,metalness:.5,clearcoat:1,clearcoatRoughness:.15,envMapIntensity:.45})));
    var glow=new T.Mesh(new T.PlaneGeometry(7.2,7.2),new T.MeshBasicMaterial({map:gradTex('155,211,233',[[0,.6],[.55,.14],[1,0]]),transparent:true,opacity:.65,depthWrite:false,toneMapped:false,blending:T.AdditiveBlending}));
    glow.rotation.x=-PI/2; glow.position.y=.078; glow.userData.decor=true; base.add(glow);
    function ring(r,w,op){ var m=new T.Mesh(new T.RingGeometry(r-w,r,140),new T.MeshBasicMaterial({color:0x9BD3E9,transparent:true,opacity:op,side:T.DoubleSide,depthWrite:false,toneMapped:false}));

    e.stopPropagation();
    var open=!modesEl.classList.contains('open');
    modesEl.classList.toggle('open',open);
    mToggle.setAttribute('aria-expanded',open?'true':'false');
  });
  modeBtns.forEach(function(b){ b.addEventListener('click',function(){
    var _m=b.getAttribute('data-mode'); setMode(_m);
    try{ localStorage.setItem('esete:mode:slides-01',_m); }catch(e){}
    closeModes(); mToggle.focus();
  }); });
  document.addEventListener('click',function(e){ if(!modesEl.contains(e.target)) closeModes(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeModes(); });

  /* ---- Controles del modelo: plegados por defecto, mismo patrón que el selector ---- */
  var ctlEl=$('ctl'), cToggle=$('cToggle');
  function closeCtl(){ ctlEl.classList.remove('open'); cToggle.setAttribute('aria-expanded','false'); }
  cToggle.addEventListener('click',function(e){
    e.stopPropagation();
    var open=!ctlEl.classList.contains('open');
    ctlEl.classList.toggle('open',open);
    cToggle.setAttribute('aria-expanded',open?'true':'false');
    if(open) ctlEl.classList.remove('attention');
  });
  document.addEventListener('click',function(e){ if(!ctlEl.contains(e.target)) closeCtl(); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeCtl(); });

  /* ---- Arrastrar para girar (control manual) ---- */
  var drag=false, lx=0, ly=0;
  canvas.addEventListener('pointerdown',function(e){ drag=true; lx=e.clientX; ly=e.clientY; try{ canvas.setPointerCapture(e.pointerId); }catch(_){} });
  canvas.addEventListener('pointermove',function(e){
    if(!drag) return;
    dragY+=(e.clientX-lx)*0.01; dragX=Math.max(-1.2,Math.min(1.2,dragX+(e.clientY-ly)*0.01)); lx=e.clientX; ly=e.clientY;
    pivot.rotation.set(dragX,dragY,0);
  });
  ['pointerup','pointercancel'].forEach(function(n){ canvas.addEventListener(n,function(){ drag=false; }); });

  /* ---- Modelo .glb local con referencia persistente (IndexedDB) ---- */
  var DB='esete-slides', STORE='models', KEY='slides-01';
  function dbOpen(){ return new Promise(function(res,rej){
    var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function dbDo(mode,fn){ return dbOpen().then(function(db){ return new Promise(function(res,rej){
    var req=fn(db.transaction(STORE,mode).objectStore(STORE)); req.onsuccess=function(){ res(req.result); }; req.onerror=function(){ rej(req.error); }; }); }); }
  var dbGet=function(){ return dbDo('readonly',function(o){ return o.get(KEY); }); };
  var dbPut=function(v){ return dbDo('readwrite',function(o){ return o.put(v,KEY); }); };
  var dbDel=function(){ return dbDo('readwrite',function(o){ return o.delete(KEY); }); };
  function dbGetK(k){ return dbDo('readonly',function(o){ return o.get(k); }); }
  function dbPutK(k,v){ return dbDo('readwrite',function(o){ return o.put(v,k); }); }
  var bLoad=$('bLoad'), bView=$('bView'), bClr=$('bClr'), fIn=$('fIn');
  function status(m){
    st.textContent=m||''; st.title=m||'';
    /* Plegado, el mensaje no se ve: el botón pulsa en dorado para avisar que hay algo. */
    if(m && !ctlEl.classList.contains('open')){
      ctlEl.classList.remove('attention'); void ctlEl.offsetWidth; ctlEl.classList.add('attention');
      clearTimeout(status._t);
      status._t=setTimeout(function(){ ctlEl.classList.remove('attention'); },2400);
    }
  }
  function syncUI(){ bView.hidden=bClr.hidden=!hasModel; bView.textContent=view==='scene'?'Ver modelo':'Ver escena'; }
  function setView(v){ view=v; dragX=dragY=0; pivot.rotation.set(0,0,0); applyVisible(); syncUI(); }
  function disposeAll(o){ o.traverse(function(n){
    if(n.geometry) n.geometry.dispose();
    if(n.material) (Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){ for(var k in m){ if(m[k]&&m[k].isTexture) m[k].dispose(); } m.dispose(); }); }); }
  function clearModel(){ while(model.children.length){ var o=model.children[0]; model.remove(o); disposeAll(o); } hasModel=false; }
  function showModel(obj){ clearModel(); model.add(fit(obj,4.8)); hasModel=true; }
  function loadBuffer(buf,name,user){
    if(!T.GLTFLoader){ status('No cargó el lector GLTFLoader'); return; }
    new T.GLTFLoader().parse(buf,'',function(g){
      showModel(g.scene); syncUI();
      if(user){
        setView('model'); status(name+' · guardando…');
        dbPut({name:name,buffer:buf.slice(0)}).then(function(){ status(name+' · guardado'); },function(){ status(name+' · sin persistencia (almacenamiento bloqueado)'); });
      }else{ status(name+' · guardado'); }
    },function(){ status('No se pudo leer el modelo (¿.glb comprimido con Draco/Meshopt?)'); });
  }
  function takeFile(f){
    if(!f) return;
    if(!/\.glb$/i.test(f.name)){ status('Usa un archivo .glb'); return; }
    var fr=new FileReader(); fr.onload=function(){ loadBuffer(fr.result,f.name,true); }; fr.readAsArrayBuffer(f);
  }
  bLoad.onclick=function(){ fIn.click(); };
  fIn.onchange=function(){ takeFile(fIn.files[0]); fIn.value=''; };
  bView.onclick=function(){ setView(view==='scene'?'model':'scene'); };
  bClr.onclick=function(){ clearModel(); setView('scene'); status('Modelo quitado'); dbDel().catch(function(){}); };
  var zone=canvas.parentElement;
  zone.addEventListener('dragover',function(e){ e.preventDefault(); });
  zone.addEventListener('drop',function(e){ e.preventDefault(); takeFile(e.dataTransfer.files[0]); });
  addEventListener('keydown',function(e){ if((e.key==='m'||e.key==='M')&&hasModel) setView(view==='scene'?'model':'scene'); });
  try{ dbGet().then(function(rec){ if(rec&&rec.buffer) loadBuffer(rec.buffer,rec.name,false); }).catch(function(){ status('Sin persistencia (almacenamiento bloqueado)'); }); }catch(e){ status('Sin persistencia'); }

  /* ---- Render ---- */
  function size(){
    measure();
    var w=canvas.clientWidth, h=canvas.clientHeight; if(!w||!h) return;
    renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
    solveFit();
    spin.scale.setScalar(fitS); spin.position.y=fitY;
  }
  colors(); size(); addEventListener('resize',size);
  if(window.ResizeObserver) new ResizeObserver(function(){ size(); }).observe(canvas);
  var lastT=0, SPIN_AXIS='y', SPIN_SPEED=.6, TURNTABLE=0.12;   // 0.12 rad/s ≈ una vuelta cada 52 s
  function loop(now){
    requestAnimationFrame(loop);
    try{
      var t=now/1000, dt=Math.min(.05,t-lastT); lastT=t;
      spin.rotation.y+=dt*(NOTURN?0:TURNTABLE); if(userUpdate) userUpdate(dt,t);                  // turntable del objeto
      if(view==='model'&&hasModel) model.rotation[SPIN_AXIS]+=dt*SPIN_SPEED;
      renderer.render(scene,camera);
    }catch(err){ status('Error de animación: '+err.message); }
  }
  setMode(window.__P3MODE__||'both');
  showCase(0);                     // arranca en la primera interacción, con la escena ya armada
  requestAnimationFrame(loop);
})();
</script>
<script id="p3Script">(function(){
  /* =====================================================================
     SEGUNDO VISOR — el slot de foto acepta imagen o .glb
     ---------------------------------------------------------------------
     Un renderer propio sobre #p3 dentro de .panel-photos. Con modelo, el
     panel lleva la clase p3-on y la CSS tapa foto, fondo y estado vacío:
     no hace falta tocar phRender() para que convivan.

     El contexto WebGL se crea PEREZOSO: la lámina ya tiene su visor, y un
     segundo contexto (más el mapa de entorno) retrasaba varios segundos el
     resto de la página en equipos sin GPU. Solo se arma cuando hay un .glb
     que mostrar — al cargarlo o al recuperarlo de IndexedDB.
     ===================================================================== */
  var panel=document.getElementById('phPanel');
  var cv=document.getElementById('p3');
  if(!panel||!cv||!window.THREE) return;
  var T=THREE, KEY='esete:p3:slides-01';
  var DB='esete-slides', STORE='models';
  var msgEl=document.getElementById('p3Msg'), msgT=0;
  function msg(m){ if(!msgEl) return; msgEl.textContent=m||''; clearTimeout(msgT);
    if(m) msgT=setTimeout(function(){ msgEl.textContent=''; },3000); }

  function dbOpen(){ return new Promise(function(res,rej){
    var r=indexedDB.open(DB,1); r.onupgradeneeded=function(){ r.result.createObjectStore(STORE); };
    r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
  function dbDo(mode,fn){ return dbOpen().then(function(db){ return new Promise(function(res,rej){
    var q=fn(db.transaction(STORE,mode).objectStore(STORE)); q.onsuccess=function(){ res(q.result); };
    q.onerror=function(){ rej(q.error); }; }); }); }
  var dbGet=function(){ return dbDo('readonly',function(o){ return o.get(KEY); }); };
  var dbPut=function(v){ return dbDo('readwrite',function(o){ return o.put(v,KEY); }); };
  var dbDel=function(){ return dbDo('readwrite',function(o){ return o.delete(KEY); }); };

  var renderer=null, scene=null, camera=null, holder=null, model=null;
  var src=null, dim=null, on=false, gl=false;
  var RX=0, RY=0, drag=null;

  /* Rotación: quieto o automática, y sobre qué eje. Se recuerda por lámina,
     así al volver el modelo gira (o no) como se había dejado. */
  var ROT={auto:false,axis:'y'}, spin={x:0,y:0,z:0};
  try{
    var r0=JSON.parse(localStorage.getItem('esete:p3rot:slides-01')||'null');
    if(r0&&/^[xyz]$/.test(r0.axis)) ROT={auto:!!r0.auto,axis:r0.axis};
  }catch(e){}
  function saveRot(){ try{ localStorage.setItem('esete:p3rot:slides-01',JSON.stringify(ROT)); }catch(e){} }
  function paintRot(){
    var box=document.getElementById('p3Rot'); if(!box) return;
    [].forEach.call(box.querySelectorAll('button[data-rot]'),function(b){
      var v=(b.getAttribute('data-rot')==='auto')===ROT.auto;
      b.classList.toggle('on',v); b.setAttribute('aria-pressed',v?'true':'false');
    });
    [].forEach.call(box.querySelectorAll('button[data-axis]'),function(b){
      var v=b.getAttribute('data-axis')===ROT.axis;
      b.classList.toggle('on',v); b.setAttribute('aria-pressed',v?'true':'false');
    });
  }

  function initGL(){
    if(gl) return true;
    try{ renderer=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true}); }
    catch(e){ msg('Sin WebGL para el modelo'); return false; }
    renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
    if(T.sRGBEncoding!==undefined) renderer.outputEncoding=T.sRGBEncoding;
    renderer.toneMapping=T.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;

    scene=new T.Scene();
    camera=new T.PerspectiveCamera(30,1,.1,120);
    (function(){
      var E=new T.Scene(); E.background=new T.Color(0x0a1a2e);
      [[7,4,-4,5,4,0xffffff,6],[3,7,7,1,-2,0x9BD3E9,4],[5,2,-3,-1,-7,0xF4D171,3.5],[12,7,0,9,0,0xffffff,1.6],[8,3,2,-4,5,0x9BD3E9,1.2],[9,2,0,3,10,0xffffff,2.5]].forEach(function(q){
        var m=new T.Mesh(new T.PlaneGeometry(q[0],q[1]),new T.MeshBasicMaterial({color:new T.Color(q[5]).multiplyScalar(q[6]),side:T.DoubleSide}));
        m.position.set(q[2],q[3],q[4]); m.lookAt(0,0,0); E.add(m); });
      var pm=new T.PMREMGenerator(renderer); scene.environment=pm.fromScene(E,.03).texture; pm.dispose();
    })();
    scene.add(new T.HemisphereLight(0x9BD3E9,0x06192e,.35));
    var sun=new T.DirectionalLight(0xfff4e0,1.1); sun.position.set(5,10,7); scene.add(sun);
    var spot=new T.SpotLight(0xffe9c8,1.3,30,.8,.7,1); spot.position.set(0,9,2); scene.add(spot);

    holder=new T.Group(); model=new T.Group(); holder.add(model); scene.add(holder);
    gl=true;
    size();
    requestAnimationFrame(loop);
    return true;
  }

  function fit(){
    if(!gl||!src||!dim) return;
    var d=camera.position.length();
    var hh=2*Math.tan(camera.fov*Math.PI/360)*d, hw=hh*camera.aspect;
    model.scale.setScalar(Math.min(hh,hw)*.62/Math.max(dim.x,dim.y,dim.z,.0001));
  }
  function size(){
    if(!gl) return;
    var w=cv.clientWidth, h=cv.clientHeight; if(!w||!h) return;
    renderer.setSize(w,h,false); camera.aspect=w/h;
    camera.position.set(0,1.5,6.0); camera.lookAt(0,0,0);
    camera.updateProjectionMatrix(); fit();
  }
  function disposeAll(o){ o.traverse(function(n){
    if(n.geometry) n.geometry.dispose();
    if(n.material) (Array.isArray(n.material)?n.material:[n.material]).forEach(function(m){
      for(var k in m){ if(m[k]&&m[k].isTexture) m[k].dispose(); } m.dispose(); }); }); }

  function clearModel(){
    if(model) while(model.children.length){ var o=model.children[0]; model.remove(o); disposeAll(o); }
    src=null; dim=null; on=false; RX=RY=0; spin={x:0,y:0,z:0};
    if(model) model.rotation.set(0,0,0);
    panel.classList.remove('p3-on');
  }
  function place(obj,name,persist){
    if(!gl) return;
    clearModel();
    src=obj; model.add(obj);
    var b=new T.Box3().setFromObject(obj);
    var c=b.getCenter(new T.Vector3());
    dim=b.getSize(new T.Vector3());
    obj.position.copy(c).negate();
    on=true; panel.classList.add('p3-on');
    size();
    msg(name+' · en el slot');
    if(persist) dbPut({name:name,buffer:persist}).catch(function(){ msg('Sin persistencia'); });
  }
  function loadBuffer(buf,name,persist){
    if(!T.GLTFLoader){ msg('No cargó GLTFLoader'); return; }
    if(!initGL()) return;
    try{
      new T.GLTFLoader().parse(buf,'',function(g){ place(g.scene,name,persist); },
        function(){ msg('No se pudo leer el modelo'); });
    }catch(e){ msg('No es un .glb válido'); }
  }

  /* ---- entrada: botón, input y arrastre ---- */
  var bPick3=document.getElementById('bPick3'), in3=document.getElementById('p3In'), bClr3=document.getElementById('p3Clr');
  if(bPick3&&in3) bPick3.onclick=function(){ in3.click(); };
  if(in3) in3.addEventListener('change',function(){
    var f=in3.files&&in3.files[0]; in3.value='';
    if(!f) return;
    var r=new FileReader();
    r.onload=function(){ loadBuffer(r.result,f.name,r.result.slice(0)); };
    r.onerror=function(){ msg('No se pudo leer el archivo'); };
    r.readAsArrayBuffer(f);
  });
  if(bClr3) bClr3.onclick=function(){ clearModel(); dbDel().catch(function(){}); msg('Modelo quitado'); };

  /* El arrastre se intercepta en captura: así el manejador de fotos no ve un
     .glb (diría «no hay imágenes») y una imagen apaga el modelo a tiempo. */
  panel.addEventListener('dragstart',function(e){ e.preventDefault(); },true);
  panel.addEventListener('drop',function(e){
    var f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
    if(!f) return;
    if(/\.(glb|gltf)$/i.test(f.name)){
      e.preventDefault(); e.stopPropagation();
      var r=new FileReader();
      r.onload=function(){ loadBuffer(r.result,f.name,r.result.slice(0)); };
      r.readAsArrayBuffer(f);
    } else { clearModel(); }
  },true);
  panel.addEventListener('dragover',function(e){ e.preventDefault(); },true);

  /* Cargar una foto quita el modelo: el slot muestra una cosa u otra. */
  var inPhoto=document.getElementById('phIn');
  if(inPhoto) inPhoto.addEventListener('change',function(){ clearModel(); },true);

  /* ---- arrastre para girar ---- */
  cv.addEventListener('pointerdown',function(e){
    if(!on) return; drag={x:e.clientX,y:e.clientY}; cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); e.preventDefault();
  });
  cv.addEventListener('pointermove',function(e){
    if(!drag||!on) return;
    RY+=(e.clientX-drag.x)*.008; RX+=(e.clientY-drag.y)*.006;
    RX=Math.max(-.7,Math.min(.7,RX)); drag={x:e.clientX,y:e.clientY};
  });
  cv.addEventListener('pointerup',function(){ drag=null; });
  cv.addEventListener('pointercancel',function(){ drag=null; });

  cv.addEventListener('wheel',function(e){
    if(!on) return; e.preventDefault();
    var s=model.scale.x*(1-(e.deltaY>0?.08:-.08));
    model.scale.setScalar(Math.max(.001,s));
  },{passive:false});

  var lastT=0;
  function loop(ts){
    if(!gl) return;
    requestAnimationFrame(loop);
    var dt=lastT?Math.min(.05,((ts||0)-lastT)/1000):0; lastT=ts||0;
    if(!on||!cv.clientWidth) return;
    if(ROT.auto) spin[ROT.axis]+=dt*.75;
    model.rotation.set(RX+spin.x,RY+spin.y,spin.z);
    renderer.render(scene,camera);
  }

  /* ---- control de rotación (plegable, solo con modelo) ---- */
  (function(){
    var box=document.getElementById('p3Rot'); if(!box) return;
    var tog=document.getElementById('p3RotToggle');
    if(tog) tog.onclick=function(){
      var o=!box.classList.contains('open');
      box.classList.toggle('open',o); tog.setAttribute('aria-expanded',o?'true':'false');
    };
    [].forEach.call(box.querySelectorAll('button[data-rot]'),function(b){
      b.onclick=function(){ ROT.auto=(b.getAttribute('data-rot')==='auto'); paintRot(); saveRot(); };
    });
    [].forEach.call(box.querySelectorAll('button[data-axis]'),function(b){
      b.onclick=function(){ ROT.axis=b.getAttribute('data-axis'); paintRot(); saveRot(); };
    });
    paintRot();
  })();

  var ro=window.ResizeObserver?new ResizeObserver(function(){ size(); }):null;
  if(ro) ro.observe(panel);
  addEventListener('resize',size);

  /* Solo si hay un modelo guardado se arma el visor al abrir la lámina. */
  try{ dbGet().then(function(rec){ if(rec&&rec.buffer) loadBuffer(rec.buffer,rec.name,null); }).catch(function(){}); }catch(e){}
})();
</script>
